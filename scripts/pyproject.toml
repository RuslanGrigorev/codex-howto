[project]
name = "codex-cli-course-ru"
version = "0.2.0"
description = "Русскоязычный автономный курс Codex CLI"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["markdown-it-py==4.2.0", "beautifulsoup4==4.14.3", "jinja2==3.1.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
