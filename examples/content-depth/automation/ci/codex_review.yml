name: Codex Automated PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Codex CLI
        run: |
          curl -fsSL https://get.codex.openai.com | sh
          echo "$HOME/.codex/bin" >> $GITHUB_PATH

      - name: Run Automated PR Review
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          codex exec --approval-policy never --sandbox-mode workspace-write \
            "Выполни diff-ревью изменений в этом PR по правилам AGENTS.md. Сформируй отчёт."
