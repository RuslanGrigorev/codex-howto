name: Codex Trusted PR Review

# Доверенный запуск по запросу мейнтейнера (защита от Prompt Injection из untrusted PR)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Номер проверяемого Pull Request"
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout base branch and PR diff (detached, unprivileged)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python environment
        uses: actions/setup-python@0b93645e9fb717ef66e32864c30861c4151877f0 # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Codex CLI (pinned 0.160.0 release)
        run: |
          CODEX_VERSION="0.160.0"
          curl -fsSL -o codex.tar.gz "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/codex-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf codex.tar.gz
          mkdir -p "$HOME/.codex/bin"
          mv codex "$HOME/.codex/bin/"
          echo "$HOME/.codex/bin" >> $GITHUB_PATH

      - name: Run Read-Only Automated PR Review
        run: |
          # Изолированный аудит: песочница только для чтения, канонический синтаксис 0.160.0
          codex exec \
            --sandbox read-only \
            --ask-for-approval always \
            --json \
            "Проведи статический анализ diff PR #${{ inputs.pr_number }} по правилам безопасности базовой ветки. Сформируй отчёт без модификации репозитория."
