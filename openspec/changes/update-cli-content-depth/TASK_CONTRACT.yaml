task_id: codex-cli-content-depth-v1
scope: 'M1: полный офлайн-кандидат в frozen scope update-cli-content-depth; только T01-T06; не M2 и не релиз.'
acceptance_criteria:
- 'AC-1: Все публичные пункты baseline 0.160.0, достижимые поля схемы и тематические области ADR-CD-01 классифицированы
  ровно один раз; происхождение и хеши проверены; возможности не исключены из-за доступа.'
- 'AC-2: Нет действующего mcp-server; общая help с exit 0 не подтверждает подкоманду; применимые команды/поля имеют
  локальные карточки; B01-B04 пройдены.'
- 'AC-3: Рубрика всех 62 исходных и новых предусмотренных уроков PASS по конкретным артефактам; прежние ID, десять
  модулей и девять упражнений сохранены.'
- 'AC-4: D01-D12 имеют согласованные mmd/SVG/пояснение, доступны file:// без JS/сети на 390 и 1440 px; опасный или
  отсутствующий SVG отклонён.'
- 'AC-5: Все H01-H04 и E01-E04 поставлены полными комплектами и проходят определённые локальные положительные/отрицательные
  сценарии; native статус не подменён.'
- 'AC-6: A01-A05 и C01 имеют полные инструкции, код/шаблоны, fixture-проверки отказа и независимые критерии; один
  Python SDK-клиент, stdio app-server, отдельные remote/cloud.'
- 'AC-7: Матрица покрывает все scenario IDs, stage-check реализован, evidence содержит нужные хеши и методы; пропущенные/поддельные/старые
  доказательства отклонены.'
- 'AC-8: UTF-8 корректен без PYTHONUTF8; четыре существующих symlink-проверки реально PASS на пригодном runner;
  полный pytest и offline PASS без ослабления тестов.'
- 'AC-9: Повторный --prepare не перезаписывает работу; профиль/секреты не читаются и не изменяются, offline не обращается
  к сети/модели и не устанавливает зависимости; интеграции не активируются.'
- 'AC-10: ZIP именно проверенного дерева валиден; полный file:// прогон распакованного пакета PASS, включая материалы/схемы/поиск/quiz/прогресс.'
- 'AC-11: Все обязательные M1 сценарии PASS и 0 OPEN P0/P1; M1 явно candidate, M2 отдельно непроверен; tested_cli
  не заполнен локальными стендами; loop и dedup соблюдены.'
