security_requirements:
- Никакой записи/чтения секретов в глобальном профиле пользователя; никаких auth/личных логов в исходниках.
- Изолированные fixture/рабочие папки; --prepare без перезаписи; нет сети/модели/install в offline.
- Не ослаблять независимые тесты, symlink/путь/пакетные проверки; никакого самовольного повышения прав.
- Не активировать MCP/hooks/plugins/CI и не публиковать/git push автоматически.
