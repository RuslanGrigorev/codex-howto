task_id: codex-cli-content-depth-v1-t01
scope: Достоверность baseline и переносимость. Критерии AC-2 на этом этапе только SYN-01, AC-1 только полный frozen
  baseline/план карты; итоговые карточки в T03. Переданный scope ограничивает часть программного AC на этом batch;
  финальная полнота в T06.
acceptance_criteria:
- 'AC-1: Полный независимый inventory и категории/планы по frozen baseline согласно INV-01/INV-02; карточки и готовые
  how-to не требуются до T03/T06.'
- 'AC-2: SYN-01: действующий mcp-server удалён, проверка help подтверждает Usage, а не exit 0 общей справки.'
- 'AC-8: ENV-01/ENV-02 реально PASS: UTF-8 чтение/вывод и четыре исходных symlink-теста на пригодном runner; полный
  pytest после исправления PASS.'
required_scenarios:
- ENV-01
- ENV-02
- INV-01
- INV-02
- SYN-01
- FRZ-01
