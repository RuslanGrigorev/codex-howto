schema_version: 1
change_id: update-cli-content-depth
program_task_id: codex-cli-content-depth-v1
milestone: M1
status: FROZEN_SPECIFICATION_NOT_EXECUTED
target_cli: 0.160.0
acceptance_criteria:
- id: AC-1
  title: Независимый frozen inventory
  pass_condition: Все публичные пункты baseline 0.160.0, достижимые поля схемы и тематические области ADR-CD-01
    классифицированы ровно один раз; происхождение и хеши проверены; возможности не исключены из-за доступа.
  scenarios:
  - INV-01
  - INV-02
  - FRZ-01
- id: AC-2
  title: Достоверный синтаксис
  pass_condition: Нет действующего mcp-server; общая help с exit 0 не подтверждает подкоманду; применимые команды/поля
    имеют локальные карточки; B01-B04 пройдены.
  scenarios:
  - SYN-01
  - SYN-02
- id: AC-3
  title: Завершённые уроки
  pass_condition: Рубрика всех 62 исходных и новых предусмотренных уроков PASS по конкретным артефактам; прежние
    ID, десять модулей и девять упражнений сохранены.
  scenarios:
  - EDU-01
  - EDU-02
- id: AC-4
  title: Двенадцать объяснённых схем
  pass_condition: D01-D12 имеют согласованные mmd/SVG/пояснение, доступны file:// без JS/сети на 390 и 1440 px;
    опасный или отсутствующий SVG отклонён.
  scenarios:
  - DIA-01
  - OFF-01
  - OFF-02
- id: AC-5
  title: Готовые расширения
  pass_condition: Все H01-H04 и E01-E04 поставлены полными комплектами и проходят определённые локальные положительные/отрицательные
    сценарии; native статус не подменён.
  scenarios:
  - EXT-01
  - EXT-02
- id: AC-6
  title: Продвинутая практика
  pass_condition: A01-A05 и C01 имеют полные инструкции, код/шаблоны, fixture-проверки отказа и независимые критерии;
    один Python SDK-клиент, stdio app-server, отдельные remote/cloud.
  scenarios:
  - AUT-01
  - CAP-01
- id: AC-7
  title: Детерминированная приёмка
  pass_condition: Матрица покрывает все scenario IDs, stage-check реализован, evidence содержит нужные хеши и методы;
    пропущенные/поддельные/старые доказательства отклонены.
  scenarios:
  - TRC-01
  - TRC-02
- id: AC-8
  title: Переносимость и исходные регрессии
  pass_condition: UTF-8 корректен без PYTHONUTF8; четыре существующих symlink-проверки реально PASS на пригодном
    runner; полный pytest и offline PASS без ослабления тестов.
  scenarios:
  - ENV-01
  - ENV-02
- id: AC-9
  title: Отсутствие побочных эффектов
  pass_condition: Повторный --prepare не перезаписывает работу; профиль/секреты не читаются и не изменяются, offline
    не обращается к сети/модели и не устанавливает зависимости; интеграции не активируются.
  scenarios:
  - SAFE-01
- id: AC-10
  title: Автономный кандидат
  pass_condition: ZIP именно проверенного дерева валиден; полный file:// прогон распакованного пакета PASS, включая
    материалы/схемы/поиск/quiz/прогресс.
  scenarios:
  - ZIP-01
- id: AC-11
  title: Честное завершение и ограниченное ревью
  pass_condition: Все обязательные M1 сценарии PASS и 0 OPEN P0/P1; M1 явно candidate, M2 отдельно непроверен; tested_cli
    не заполнен локальными стендами; loop и dedup соблюдены.
  scenarios:
  - GATE-01
  - GATE-02
  - REV-01
  - REV-02
