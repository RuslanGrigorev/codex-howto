howto_units:
- id: B01
  title: Основной рабочий цикл
  batch: T03
  required_checks:
  - read-only исследование без записи
  - ограниченная правка с independent tests/diff
  - plan перед изменением
  - goal состояния pause/resume/edit/clear без обещания отката
  - review известного граничного дефекта
  native_validation: M2; локальная fixture-проверка не live
- id: B02
  title: Конфигурация и провайдер
  batch: T03
  required_checks:
  - base/profile/project/CLI и административные ограничения
  - валидный config и неизвестный ключ
  - реальный выбор доступного model/reasoning без вечного ID
  - локальный провайдер подготовлен либо диагностирован как недоступный
  - disabled/cached/live web_search и доступность tools
  native_validation: M2; локальная fixture-проверка не live
- id: B03
  title: Контекст и сессия
  batch: T03
  required_checks:
  - AGENTS scope и skill explicit discovery
  - compact/recap/memories не равны Git
  - resume/fork плюс реальное чтение актуального файла
  - managed worktree и отсутствие конфликтующей записи
  - queue/public session commands documented; destructive migration reference-only
  native_validation: M2; локальная fixture-проверка не live
- id: B04
  title: Входы и терминал
  batch: T03
  required_checks:
  - изображение существующего fixture без секретов
  - web-search проверка источников и untrusted input
  - completion для PowerShell и справочная Bash/zsh/fish
  - VISUAL/EDITOR и клавиши темы
  - платформенная матрица native Windows/WSL/macOS/Linux без неподтверждённого PASS
  native_validation: M2; локальная fixture-проверка не live
- id: H01
  title: PreToolUse
  batch: T04
  required_checks:
  - положительный allow
  - известный запрещённый harmless input не выполнен
  - неверный JSON обнаружен; неподдерживаемый output не назван защитой
  native_validation: M2; локальная fixture-проверка не live
- id: H02
  title: PostToolUse
  batch: T04
  required_checks:
  - наблюдение корректного результата
  - ошибка инструмента не названа успехом
  - никакое post-событие не названо откатом уже выполненного действия
  native_validation: M2; локальная fixture-проверка не live
- id: H03
  title: UserPromptSubmit
  batch: T04
  required_checks:
  - безопасный дополнительный контекст в поддерживаемом формате
  - неверный input/output обнаружен
  - исходный смысл запроса не изменён скрытно
  native_validation: M2; локальная fixture-проверка не live
- id: H04
  title: Stop
  batch: T04
  required_checks:
  - разрешённое завершение
  - контролируемое незавершённое условие в поддерживаемом формате
  - защита от повторного бесконечного возобновления при stop_hook_active/эквиваленте baseline
  native_validation: M2; локальная fixture-проверка не live
- id: E01
  title: Субагенты
  batch: T04
  required_checks:
  - три роли explorer/read-only reviewer/workspace-write implementer
  - явная делегация непересекающихся задач
  - переданные контекст и разрешения описаны
  - результат собирается и проверяется независимо
  - ошибка/остановка дочерней задачи не даёт false success
  native_validation: M2; локальная fixture-проверка не live
- id: E02
  title: Skills
  batch: T04
  required_checks:
  - четыре комплекта project-map/diff-review/test-plan/docs-update
  - SKILL.md плюс все используемые references/scripts
  - explicit invocation и наблюдаемая процедура
  - missing input/resource диагностирован
  - нет автоматической публикации/секретов/дополнительных прав
  native_validation: M2; локальная fixture-проверка не live
- id: E03
  title: Plugin
  batch: T04
  required_checks:
  - один полный plugin bundle с поддержанным baseline manifest
  - проверенный skill и MCP-компонент в составе
  - описанные установка/доверие/удаление
  - missing component/malformed manifest отклонены
  - пакет не активирован автоматически
  native_validation: M2; локальная fixture-проверка не live
- id: E04
  title: MCP
  batch: T04
  required_checks:
  - stdio initialize/notifications/tools-list/call и работа после отказа
  - разрешённый файл и путь за root
  - HTTP/OAuth последовательность без личного аккаунта в offline
  - auth error/timeout/missing tool различены
  - полный fixture contract и отдельная инструкция реального Codex
  native_validation: M2; локальная fixture-проверка не live
- id: A01
  title: Exec
  batch: T05
  required_checks:
  - stdin и stdout/stderr различены
  - JSONL плюс output-schema плюс last-message
  - exit 0 без требуемого terminal result не успех
  - empty/truncated/turn-failed обработаны
  - unknown event не скрывает известную ошибку
  - timeout/cancel/retry/resume без повторных неконтролируемых side effects
  native_validation: M2; локальная fixture-проверка не live
- id: A02
  title: GitHub Action
  batch: T05
  required_checks:
  - workflow в examples, точная проверенная версия/commit
  - только доверенный ручной model run с secrets scoped
  - недоверенный PR не исполняется с привилегированными секретами
  - contents read и persist-credentials false
  - exit/artifact/limits заданы; workflow не активирован
  native_validation: M2; локальная fixture-проверка не live
- id: A03
  title: Python SDK
  batch: T05
  required_checks:
  - один executable client и version-pinned isolated requirements
  - start/continue/resume по поддерживаемому API
  - известная ошибка/timeout наблюдаемы
  - fixture adapter tests без модели и install в offline
  - TS SDK только локальная справочная карта
  native_validation: M2; локальная fixture-проверка не live
- id: A04
  title: App-server
  batch: T05
  required_checks:
  - 'один stdio client: initialize/thread/turn/events согласно baseline'
  - events не путаются с exec JSONL
  - ошибка/cancel/EOF и process cleanup
  - fixture child-process tests без auth/модели
  - схема D12 и отдельная инструкция реального применения
  native_validation: M2; локальная fixture-проверка не live
- id: A05
  title: Remote и cloud
  batch: T05
  required_checks:
  - remote-loopback/TLS-SSH/auth-token-env и где файлы/код
  - явное отличие cloud от remote app-server
  - последовательность получить/просмотреть/применить diff и local tests по baseline CLI
  - timeout/auth/недоступность без ложной успешной отправки
  - cloud не запускается без отдельного доступа
  native_validation: M2; локальная fixture-проверка не live
- id: C01
  title: Итоговая практика
  batch: T06
  required_checks:
  - одна fixture-задача с независимыми тестами
  - локальный самостоятельный маршрут без модели
  - отдельный live-маршрут skill/plan/изменение/tests/review
  - diff ограничен разрешёнными файлами
  - нет изменения независимых тестов ради success
  native_validation: M2; локальная fixture-проверка не live
lesson_rubric:
- цель и проверяемый результат
- предпосылки и ограничения доступности
- объяснение механизма, не список названий
- разобранный пример с точным вводом и наблюдаемым результатом
- самостоятельное задание без догадки
- полезная подсказка
- разбор достижения результата
- независимый наблюдаемый критерий
- локальный материал и применимый официальный источник
evidence_schema:
  required_fields:
  - scenario_id
  - method
  - status
  - candidate_tree_sha256
  - spec_sha256
  - command_or_rubric
  - exit_code_or_rubric_results
  - environment
  - artifacts
  artifact_fields:
  - relative_path
  - sha256
  manual_fields:
  - reviewer
  - reviewed_file_sha256
  - rubric_item
  - result
  - concrete_evidence
  statuses:
  - PASS
  - FAIL
  - BLOCKED
  - NOT_RUN
  - SKIP
  scope: только .learning, секреты и личные логи запрещены
commands:
  existing_local:
  - python scripts/check_project.py catalog
  - python scripts/check_project.py exercises
  - python scripts/check_coverage.py
  - python -m pytest -q scripts/tests
  - python scripts/verify.py --profile offline
  - python scripts/package_course.py --site .learning/site
  to_implement_by_T01: python scripts/check_content_contract.py --stage T01 --report .learning/reports/content/T01.json
  per_batch: python scripts/check_content_contract.py --stage Txx --report .learning/reports/content/Txx.json
  final:
  - python scripts/check_content_contract.py --stage T06 --report .learning/reports/content/T06.json
  - python scripts/check_coverage.py --require-complete
  final_note: --require-complete относится к зафиксированной области и редакционной полноте; native/release доказательства
    не отключаются и оцениваются отдельно
