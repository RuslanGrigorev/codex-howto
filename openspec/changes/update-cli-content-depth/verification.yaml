excluded_from_M1:
- авторизованные платные model/cloud вызовы
- подтверждённая совместимость всех платформ
- изменение глобального профиля или прав ОС
- публикация/git push/release
- полный crawl всего ChatGPT Learn
- второй SDK-клиент на TypeScript
M2: Отдельный согласованный goal; действующие live/release/ручные проверки остаются обязательными для совместимого
  выпуска.
stage_scope_semantics: scenario ID одинаковый при поэтапной проверке. Batch применяет только свою конечную подгруппу
  из scope_note/scoped_acceptance_criteria; T06 применяет полный программный scope. Primary batch сценария указывает
  первую полную реализацию проверяющего метода, а не запрет его использования ранее. Все future methods обязаны
  быть реализованы соответствующим использующим batch, отсутствие helper/test/evidence блокирует PASS.
safety_scope: Глобальный настоящий профиль не читается/не модифицируется даже ради canary. Контрольные профили только
  внутри тестовых временных каталогов; .learning/convergence принадлежит оркестратору, developer его не редактирует.
