<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
      .box-orch { fill: #1e293b; stroke: #38bdf8; stroke-width: 2.5px; rx: 10px; }
      .box-role1 { fill: #1e293b; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .box-role2 { fill: #1e293b; stroke: #10b981; stroke-width: 2px; rx: 8px; }
      .box-role3 { fill: #1e293b; stroke: #f59e0b; stroke-width: 2px; rx: 8px; }
      .box-user { fill: #1e293b; stroke: #64748b; stroke-width: 2px; rx: 8px; }
      .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .text-body { fill: #cbd5e1; font-family: system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2px; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-return { stroke: #94a3b8; stroke-width: 1.5px; stroke-dasharray: 4; fill: none; marker-end: url(#arrowhead); }
      .label { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="880" height="560" class="bg" />

  <text x="40" y="45" class="title">D10: Делегация задач и изоляция контекста субагентов</text>
  <text x="40" y="68" class="subtitle">Специализированные роли: исследователь (read-only), исполнитель (workspace-write) и ревьюер</text>

  <!-- User Box -->
  <rect x="50" y="110" width="180" height="75" class="box-user" />
  <text x="140" y="142" class="text-title">Пользователь</text>
  <text x="140" y="165" class="text-body">Постановка общей цели</text>

  <!-- Orchestrator Box -->
  <rect x="290" y="110" width="300" height="75" class="box-orch" />
  <text x="440" y="138" class="text-title" style="fill:#38bdf8;">Главный Оркестратор</text>
  <text x="440" y="158" class="text-body">• Владеет планом и целью сессии</text>
  <text x="440" y="174" class="text-body">• Формирует изолированные задачи</text>

  <path d="M 230 147 L 285 147" class="arrow-blue" />

  <!-- Subagent 1: Explorer -->
  <rect x="50" y="270" width="230" height="150" class="box-role1" />
  <text x="165" y="300" class="text-title" style="fill:#d8b4fe;">1. Исследователь</text>
  <text x="165" y="322" class="text-body" style="font-family:monospace; font-size:11px;">role = "explorer"</text>
  <text x="165" y="345" class="text-body">• sandbox: <tspan style="fill:#38bdf8;">read-only</tspan></text>
  <text x="165" y="365" class="text-body">• Поиск символов и связей</text>
  <text x="165" y="385" class="text-body">• Изучение документации</text>
  <text x="165" y="405" class="text-body" style="fill:#a855f7;">Запрет на запись файлов</text>

  <!-- Subagent 2: Implementer -->
  <rect x="325" y="270" width="230" height="150" class="box-role2" />
  <text x="440" y="300" class="text-title" style="fill:#a7f3d0;">2. Исполнитель</text>
  <text x="440" y="322" class="text-body" style="font-family:monospace; font-size:11px;">role = "implementer"</text>
  <text x="440" y="345" class="text-body">• sandbox: <tspan style="fill:#10b981;">workspace-write</tspan></text>
  <text x="440" y="365" class="text-body">• Создание минимального diff</text>
  <text x="440" y="385" class="text-body">• Запуск локальных тестов</text>
  <text x="440" y="405" class="text-body" style="fill:#10b981;">Правка только в задаче</text>

  <!-- Subagent 3: Reviewer -->
  <rect x="600" y="270" width="230" height="150" class="box-role3" />
  <text x="715" y="300" class="text-title" style="fill:#fde68a;">3. Ревьюер</text>
  <text x="715" y="322" class="text-body" style="font-family:monospace; font-size:11px;">role = "reviewer"</text>
  <text x="715" y="345" class="text-body">• sandbox: <tspan style="fill:#38bdf8;">read-only</tspan></text>
  <text x="715" y="365" class="text-body">• Проверка критериев приёмки</text>
  <text x="715" y="385" class="text-body">• Поиск регрессий и огрехов</text>
  <text x="715" y="405" class="text-body" style="fill:#f59e0b;">Вердикт: APPROVE / CHANGES</text>

  <!-- Delegation arrows (Orchestrator to Roles) -->
  <path d="M 370 185 L 165 265" class="arrow" />
  <path d="M 440 185 L 440 265" class="arrow" />
  <path d="M 510 185 L 715 265" class="arrow" />

  <!-- Return arrows (Roles back to Orchestrator) -->
  <path d="M 195 265 L 390 190" class="arrow-return" />
  <path d="M 745 265 L 530 190" class="arrow-return" />

  <!-- Bottom rule -->
  <rect x="50" y="450" width="780" height="70" style="fill:#1e293b; stroke:#334155; stroke-width:1px; rx:8px;" />
  <text x="440" y="478" class="text-title" style="fill:#f8fafc; font-size:13px;">Изоляция контекста субагента</text>
  <text x="440" y="502" class="text-body">
    Каждый субагент запускается с чистым контекстным окном, содержащим только переданную задачу и необходимые файлы.
    Это предотвращает загрязнение токенов и гарантирует воспроизводимость результатов.
  </text>
</svg>
