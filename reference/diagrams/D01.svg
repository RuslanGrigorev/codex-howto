<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 2px; rx: 8px; }
      .box-user { fill: #1e293b; stroke: #38bdf8; stroke-width: 2px; rx: 8px; }
      .box-model { fill: #1e293b; stroke: #a855f7; stroke-width: 2px; rx: 8px; }
      .box-safety { fill: #1e293b; stroke: #f59e0b; stroke-width: 2px; rx: 8px; }
      .box-exec { fill: #1e293b; stroke: #10b981; stroke-width: 2px; rx: 8px; }
      .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .text-body { fill: #cbd5e1; font-family: system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #38bdf8; stroke-width: 2px; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-emerald { stroke: #10b981; stroke-width: 2px; fill: none; marker-end: url(#arrowhead-emerald); }
      .arrow-purple { stroke: #a855f7; stroke-width: 2px; fill: none; marker-end: url(#arrowhead-purple); }
      .label { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="880" height="560" class="bg" />

  <text x="40" y="45" class="title">D01: Агентный цикл Codex CLI (Workflow Loop)</text>
  <text x="40" y="68" class="subtitle">Поток управления: от запроса пользователя к формированию контекста, проверке песочницы и наблюдению</text>

  <!-- User Box -->
  <rect x="40" y="110" width="180" height="70" class="box-user" />
  <text x="130" y="138" class="text-title">Пользователь</text>
  <text x="130" y="158" class="text-body">Ввод команды / промпта</text>

  <!-- Engine Box -->
  <rect x="270" y="110" width="190" height="70" class="box" />
  <text x="365" y="138" class="text-title">TUI / Движок Codex</text>
  <text x="365" y="158" class="text-body">Управление сессией и turn</text>

  <!-- Context Assembly -->
  <rect x="510" y="110" width="200" height="70" class="box" />
  <text x="610" y="138" class="text-title">Сборка контекста</text>
  <text x="610" y="158" class="text-body">AGENTS.md + История + Файлы</text>

  <!-- Model (LLM) -->
  <rect x="510" y="240" width="200" height="75" class="box-model" />
  <text x="610" y="268" class="text-title">Модель (LLM)</text>
  <text x="610" y="288" class="text-body">Рассуждения и выбор шага</text>

  <!-- Final Answer Path -->
  <rect x="40" y="240" width="180" height="75" class="box" />
  <text x="130" y="268" class="text-title">Текстовый ответ</text>
  <text x="130" y="288" class="text-body">Вывод в терминал</text>

  <!-- Safety Gate -->
  <rect x="510" y="380" width="200" height="75" class="box-safety" />
  <text x="610" y="408" class="text-title">Песочница и Approval</text>
  <text x="610" y="428" class="text-body">Проверка прав и политик</text>

  <!-- Tool Execution -->
  <rect x="250" y="380" width="200" height="75" class="box-exec" />
  <text x="350" y="408" class="text-title">Исполнение инструмента</text>
  <text x="350" y="428" class="text-body">Файлы / bash / поиск</text>

  <!-- Observation Loop -->
  <rect x="250" y="240" width="200" height="75" class="box" />
  <text x="350" y="268" class="text-title">Наблюдение (Observation)</text>
  <text x="350" y="288" class="text-body">stdout / stderr / diff</text>

  <!-- Connecting Arrows -->
  <path d="M 220 145 L 265 145" class="arrow-blue" />
  <path d="M 460 145 L 505 145" class="arrow" />
  <path d="M 610 180 L 610 235" class="arrow-purple" />
  
  <!-- Model to text answer -->
  <path d="M 510 275 L 225 275" class="arrow" />
  <text x="365" y="268" class="label">Ответ без инструментов</text>
  <path d="M 130 240 L 130 185" class="arrow-blue" />

  <!-- Model to safety gate -->
  <path d="M 610 315 L 610 375" class="arrow-purple" />
  <text x="670" y="348" class="label">Вызов инструмента</text>

  <!-- Safety gate to tool exec -->
  <path d="M 510 417 L 455 417" class="arrow-emerald" />
  <text x="480" y="410" class="label">OK</text>

  <!-- Tool exec to observation -->
  <path d="M 350 380 L 350 320" class="arrow" />
  <text x="385" y="352" class="label">Вывод</text>

  <!-- Observation back to Context -->
  <path d="M 450 255 L 480 255 L 480 160 L 505 160" class="arrow" />
  <text x="480" y="205" class="label">Новый контекст</text>
</svg>
