name: Проверки курса
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify.py --profile offline
      - run: python scripts/package_course.py --site .learning/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-candidate-and-checks-${{ matrix.python }}
          path: |
            .learning/reports/
            .learning/evidence/logs/
            .learning/dist/
          if-no-files-found: warn
# Это проверка и ZIP-кандидат, не автоматическая публикация релиза.
# Secrets/API-ключи модели не требуются и не передаются.
