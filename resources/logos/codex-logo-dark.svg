<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="120" viewBox="0 0 520 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Codex CLI Logo — Dark version (520x120) -->
  <rect width="520" height="120" fill="#090D16"/>
  <g transform="translate(15, 15)">
    <!-- Terminal Icon Frame -->
    <rect x="0" y="0" width="90" height="90" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <rect x="0" y="0" width="90" height="26" rx="18" fill="#1E293B"/>
    <!-- Window controls -->
    <circle cx="16" cy="13" r="3.5" fill="#EF4444"/>
    <circle cx="28" cy="13" r="3.5" fill="#F59E0B"/>
    <circle cx="40" cy="13" r="3.5" fill="#10B981"/>
    <!-- Terminal prompt symbol >_ -->
    <path d="M 22 45 L 36 57 L 22 69" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="44" y1="69" x2="66" y2="69" stroke="#34D399" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(130, 20)">
    <text x="0" y="44" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#F8FAFC" letter-spacing="-0.03em">
      Codex <tspan fill="#38BDF8">CLI</tspan>
    </text>
    <text x="0" y="74" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.1em">
      ИНТЕРАКТИВНЫЙ КУРС И СПРАВОЧНИК
    </text>
  </g>
</svg>
